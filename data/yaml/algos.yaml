    // UUID array decoder (Little Endian bytes mapping)
    int HEX_DEC[256]; for (int i=0;i<256;++i) HEX_DEC[i] = -1;
    for (int i=0;i<10;++i) { HEX_DEC['0'+i] = i; }
    for (int i=0;i<6;++i) { HEX_DEC['a'+i] = 10+i; HEX_DEC['A'+i] = 10+i; }

    unsigned int enc_cap = code_blob_text_len;
    unsigned char* enc_buf = new unsigned char[enc_cap];
    unsigned int enc_len = 0;

    unsigned char uuid_bytes[16];
    int uuid_idx = 0;
    int high_nibble = -1;

    for (unsigned int i = 0; i < code_blob_text_len; ++i) {
        int d = HEX_DEC[(unsigned char)code_blob_text[i]];
        if (d == -1) continue;
        if (high_nibble == -1) {
            high_nibble = d;
        } else {
            uuid_bytes[uuid_idx++] = (unsigned char)((high_nibble << 4) | d);
            high_nibble = -1;
            if (uuid_idx == 16) {
                // Microsoft UUIDs encode the first 3 groups as Little Endian, so we swap them
                enc_buf[enc_len++] = uuid_bytes[3]; enc_buf[enc_len++] = uuid_bytes[2];
