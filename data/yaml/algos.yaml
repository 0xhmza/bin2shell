    import uuid
    def envelope(data: bytes) -> str:
        padded = data + b'\x00' * ((16 - len(data) % 16) % 16)
        out = []
        for i in range(0, len(padded), 16):
            chunk = padded[i:i+16]
            out.append(str(uuid.UUID(bytes_le=chunk)))
        return ",\n".join(out)
