                enc_buf[enc_len++] = uuid_bytes[5]; enc_buf[enc_len++] = uuid_bytes[4];
                enc_buf[enc_len++] = uuid_bytes[7]; enc_buf[enc_len++] = uuid_bytes[6];
                for (int j = 8; j < 16; j++) enc_buf[enc_len++] = uuid_bytes[j];
                uuid_idx = 0;
            }
        }
    }
